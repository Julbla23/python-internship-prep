{% load static %}

<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Statystyki tygodnia</title>
</head>
<body>
    <h1>
        Zadania zrobione: {{ statistics.done }}
        Zadania przesunięte: {{ statistics.moved }}
        Zadania zaległe: {{ statistics.overdue }}
        Backlog: {{ statistics.backlog }}
    </h1>
    <canvas id="categoryChart"></canvas>
    {{ statistics.category|json_script:"category-data" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'js/chart.js' %}"></script>
</body>
</html>
